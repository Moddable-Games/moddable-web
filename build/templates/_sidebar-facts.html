<div class="{{page_id}}-sidebar__card">
  <div class="{{page_id}}-sidebar__card-title">{{title}}</div>
  {{#each items}}
  <div class="{{page_id}}-stat">
    <span class="{{page_id}}-stat__label">{{label}}</span>
    <span class="{{page_id}}-stat__value">{{value}}</span>
  </div>
  {{/each}}
</div>
