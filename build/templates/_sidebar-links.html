<div class="{{page_id}}-sidebar__card">
  <div class="{{page_id}}-sidebar__card-title">{{title}}</div>
  <div class="{{page_id}}-sidebar__links">
    {{#each items}}
    <a href="{{href}}" class="{{page_id}}-sidebar__link"{{#if external}} target="_blank" rel="noopener"{{/if}}>
      <div class="{{page_id}}-sidebar__link-dot" style="background:{{color}}"></div>
      <div>
        <div class="{{page_id}}-sidebar__link-label">{{label}}</div>
        <div class="{{page_id}}-sidebar__link-sub">{{sub}}</div>
      </div>
    </a>
    {{/each}}
  </div>
</div>
