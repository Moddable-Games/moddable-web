<div class="sub-form" id="sub-form">
  <div class="sub-form__email-row">
    <input type="email" class="sub-form__email" placeholder="{{email_placeholder}}" required>
  </div>
  {{#if checks}}
  <div class="sub-form__checks">
    {{#each checks}}
    <label class="sub-form__check"><input type="checkbox" checked>{{this}}</label>
    {{/each}}
  </div>
  {{/if}}
  <button class="mg-btn mg-btn--green sub-form__submit" data-action="{{action}}">{{submit_label}}</button>
  <div class="sub-form__error" id="sub-error" hidden>{{error_message}}</div>
</div>
<div class="sub-success" id="sub-success">
  <div class="sub-success__icon">&#10003;</div>
  <div class="sub-success__title">{{success_heading}}</div>
  <p class="sub-success__text">{{success_body}}</p>
</div>
