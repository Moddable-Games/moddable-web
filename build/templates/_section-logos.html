{{#if heading}}<h2 class="press-section__title">{{heading}}</h2>{{/if}}
<div class="press-logo-grid">
  {{#each items}}
  <a href="{{src}}" target="_blank" rel="noopener" class="press-logo-card" style="background:{{bg}}">
    <img src="{{src}}" alt="{{label}}" class="press-logo-card__img">
    <div class="press-logo-card__label">{{label}}</div>
  </a>
  {{/each}}
</div>
