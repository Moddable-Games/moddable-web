<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0a0d2a">
{{#if meta.full_title}}<title>{{meta.full_title}}</title>{{/if}}
{{#unless meta.full_title}}<title>{{meta.title}} — Moddable.Games</title>{{/unless}}
<meta name="description" content="{{meta.description}}">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<meta property="og:url" content="{{meta.url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moddable.Games">
<meta property="og:image" content="{{meta.image}}?v={{version}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{meta.title}}">
<meta name="twitter:description" content="{{meta.description}}">
<meta name="twitter:image" content="{{meta.image}}?v={{version}}">
<link rel="stylesheet" href="/css/{{css_bundle}}.css?v={{version}}">
</head>
<body{{#if body_class}} class="{{body_class}}"{{/if}}>
