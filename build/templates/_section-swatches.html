{{#if heading}}<h2 class="press-section__title">{{heading}}</h2>{{/if}}
<div class="press-swatches">
  {{#each items}}
  <div class="press-swatch">
    <div class="press-swatch__color" style="background-color:{{hex}}"></div>
    <div class="press-swatch__hex">{{hex}}</div>
    <div class="press-swatch__name">{{name}}</div>
  </div>
  {{/each}}
</div>
