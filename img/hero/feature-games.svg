<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="260" height="260">
<style>
.hex-cell { fill: none; stroke: #e8a91a; stroke-width: 0.8; opacity: 0.3; }
.hex-cell--lit { fill: rgba(232,169,26,0.08); opacity: 0.7; animation: hexPulse 4s ease-in-out infinite; }
.hex-cell--lit:nth-child(5) { animation-delay: 0.8s; }
.hex-cell--lit:nth-child(10) { animation-delay: 1.6s; }
.hex-cell--lit:nth-child(11) { animation-delay: 2.4s; }
@keyframes hexPulse { 0%, 100% { fill: rgba(232,169,26,0.06); opacity: 0.5; } 50% { fill: rgba(232,169,26,0.18); opacity: 0.9; } }
.piece { fill: #e8a91a; opacity: 0; animation: pieceDrop 5s ease-out infinite; }
@keyframes pieceDrop { 0% { opacity: 0; transform: translateY(-8px) scale(0.6); } 12% { opacity: 0.9; transform: translateY(0) scale(1); } 70% { opacity: 0.9; } 85% { opacity: 0; transform: translateY(3px) scale(0.8); } 100% { opacity: 0; } }
.move-path { stroke: #e8a91a; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 30; stroke-dashoffset: 30; fill: none; opacity: 0.6; animation: moveDraw 5s ease-in-out infinite; animation-delay: 1.5s; }
@keyframes moveDraw { 0%, 10% { stroke-dashoffset: 30; opacity: 0; } 20% { opacity: 0.6; } 50% { stroke-dashoffset: 0; opacity: 0.6; } 70% { opacity: 0; stroke-dashoffset: 0; } 100% { opacity: 0; stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .hex-cell--lit, .piece, .move-path { animation: none; opacity: 0.7; } }
</style>
